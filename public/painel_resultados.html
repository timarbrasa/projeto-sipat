<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escape Room | Marbrasa</title>
  <link rel="stylesheet" href="panel-style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>
<body>
  <!-- React container -->
  <div id="lista-react"></div>

  <div class="painel">
    <h1 class="titles">ESCAPE ROOM | MARBRASA</h1>
    <p class="subtitle">Resultados Finais</p>
    <div class="row">
      <div class="painel-winners">
        <h2><i class="bi bi-check-circle"></i>Conseguiram Escapar</h2>
         <div id="lista-vencedores"></div> <!-- Aqui será renderizada a lista -->

      </div>
      <div class="painel-losers">
        <h2><i class="bi bi-x-circle"></i>Não Conseguiram Escapar</h2>
         <div class="lista-vencedores-div" id="lista-perdedores"></div> <!-- Aqui será renderizada a lista -->
      </div>
    </div>
    <div class="row_itens">
      <div class="item-1">
        <p>10</p>
        <p>total</p>
      </div>
      <div class="item-2">
        <p>10</p>
        <p>total</p>
      </div>
      <div class="item-3">
        <p>10</p>
        <p>total</p>
      </div>
    </div>
  </div>

  <!-- React e ReactDOM via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

 <script>
  const e = React.createElement;
   const f = React.createElement;

  function ListaWinners() {
    const nomes = ["Beatriz", "Beatriz", "Carlos", "Daniel","Beatriz","Beatriz","Beatriz","Beatriz"];
   return e(
  'ul',
  { className: 'lista-nomes' },
  nomes.map((nome, index) =>
    e('li', { key: index }, nome)
  )
);
  }

    function ListaLosers () {
    const losers = ["Beatriz","Beatriz","Beatriz", "Beatriz", "Carlos", "Daniel","Beatriz","Beatriz","Beatriz","Beatriz"];
   return f(
  'ul',
  { className: 'lista-losers' },
  losers.map((losers, index) =>
    f('li', { key: index }, losers)
  )
);
  }
  const winnersListR = ReactDOM.createRoot(document.getElementById('lista-vencedores'));
    const LosersList = ReactDOM.createRoot(document.getElementById('lista-perdedores'));
  winnersListR.render(e(ListaWinners));
  LosersList.render(f(ListaLosers));
</script>
</body>
</html>
