<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Room SIPAT MARBRASA</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=lock_clock" />
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=shield_lock" />
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=encrypted" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
<body>
    <header>
            <img src="./images/sipat-logo.png" id="sipat-logo" alt="">
    </header>

    <div id="start-screen" class="screen active">
        <div class="icones">
            <i class="bi bi-lock"></i>
            <i class="fa-regular fa-user"></i>
            <i class="bi bi-shield-lock"></i>
        </div>
        <h1 id="titulo">ESCAPE ROOM <span id="separador">|</span> MARBRASA</h1>
        <h2 id="titulo2">O Desafio da Segurança!</h2>
        <div class="input-group">
            <label for="team-name">Nome da Equipe:</label>
            <input type="text" id="team-name" placeholder="Digite o nome da sua equipe aqui">
        </div>
        <button id="start-button">INICIAR JOGO</button>
        <button id="admin-login-button">LOGIN ADMINISTRADOR</button>
    </div>

    <div id="game-screen" class="screen">
        </div>

    <div id="admin-login-screen" class="screen">
        <h2>Área Restrita - Login do Administrador</h2>
        <div class="input-group">
            <label for="admin-username">Usuário:</label>
            <input type="text" id="admin-username" placeholder="Digite seu usuário">
        </div>
        <div class="input-group">
            <label for="admin-password">Senha:</label>
            <input type="password" id="admin-password" placeholder="Digite sua senha">
        </div>
        <button id="login-submit-button">ENTRAR</button>
        <button class="return-button" onclick="showScreen(startScreen)">Voltar à Tela Inicial</button>
    </div>

    <div id="ranking-screen" class="screen">
        </div>

    <div id="penalty-light"></div>

    <script src="script.js"></script>
</body>
</html>
